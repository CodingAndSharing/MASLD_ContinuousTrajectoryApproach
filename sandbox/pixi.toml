[workspace]
authors = ["Koryna <onlyfordevelopingandsharing@outlook.com>"]
channels = ["conda-forge", "bioconda"]
description = "Reproduces the R/Python stack in ../software_requirements.txt for the MASLD sandbox -- see CLAUDE_NOTES.md."
name = "masld-sandbox"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
# PCSF and OmnipathR have no conda-forge/bioconda build; both are pure R with
# no compiled deps beyond what's already in this env, so they're installed
# straight from GitHub via `remotes` instead. See CLAUDE_NOTES.md.
install-pcsf = "Rscript -e 'remotes::install_github(\"IOR-Bioinformatics/PCSF\", upgrade = \"never\")'"
# Requested OmnipathR 3.8.0 is pre-rewrite and incompatible with current
# OmnipathR/Bioconductor APIs -- installs current (4.x) instead.
install-omnipathr = "Rscript -e 'remotes::install_github(\"saezlab/OmnipathR\", upgrade = \"never\")'"

# Both r-irkernel and ipykernel register a Jupyter kernelspec at install
# time, but ipykernel's default display name ("Python 3 (ipykernel)") is
# indistinguishable from any other Python kernel on the machine -- easy to
# pick the wrong one, or the R kernel by mistake, for a pure-Python notebook
# (or vice versa). Re-registers both with matching, unambiguous names so the
# kernel picker makes clear which entries belong to this pixi env.
setup-jupyter-kernels = "Rscript -e 'IRkernel::installspec(name = \"ir\", displayname = \"R (MASLD sandbox pixi)\", user = FALSE)' && python -m ipykernel install --sys-prefix --name python3 --display-name 'Python 3 (MASLD sandbox pixi)'"

[dependencies]
# Every entry below is pinned with "==" to the exact version+build already
# validated in this sandbox (cross-checked against the running env's
# conda-meta records). This is deliberate, not the original design: an
# earlier version of this file left everything but python/r-base as "*",
# and a single `pixi install` run against today's conda-forge/bioconda
# silently jumped numpy 1.26.4->2.5.1, pandas 2.1.4->3.0.3 (a breaking
# major-version change), scipy 1.11.4->1.18.0, statsmodels 0.14.1->0.14.6,
# python-igraph 0.11.4->1.0.0, and r-igraph/r-plotly by a minor version --
# all within 4 days of the original install. "*" is not reproducible; only
# exact pins + a committed pixi.lock are.
python = "==3.12.3"
r-base = "==4.4.1"

# --- Python libraries (software_requirements.txt) ---
python-igraph = "==0.11.4"
numpy = "==1.26.4"
pandas = "==2.1.4"
# 1.11.4 is not published for linux-aarch64, so use 1.14.0 which is
# available for Python 3.12 on both linux-64 and linux-aarch64.
scipy = "==1.14.0"
statsmodels = "==0.14.1"
chembl_webresource_client = "==0.10.9"

# --- R libraries (software_requirements.txt) ---
# Exact versions below are what actually solved successfully together on
# 2026-07-20 for this R 4.4 / Bioconductor build line -- see CLAUDE_NOTES.md
# for the full requested-vs-installed deviation table (e.g. caret
# 6.0-94 requested -> 7.0-1 installed; slingshot 3.22 requested, which was
# never a real release, -> 2.14.0 installed).
r-assertr = "==3.0.1"
bioconductor-biocparallel = "==1.40.0"
bioconductor-biomart = "==2.62.0"
r-broom = "==1.0.13"
r-caret = "==7.0_1"
r-cowplot = "==1.2.0"
"r-data.table" = "==1.18.4"
bioconductor-decoupler = "==2.12.0"
bioconductor-deseq2 = "==1.46.0"
r-dplyr = "==1.2.1"
r-flashclust = "==1.1_4"
r-ggplot2 = "==4.0.3"
r-ggpubr = "==1.0.0"
"bioconductor-go.db" = "==3.20.0"
bioconductor-gosemsim = "==2.32.0"
r-gridextra = "==2.3.1"
r-igraph = "==2.1.4"
r-jsonlite = "==2.0.0"
r-modelr = "==0.1.11"
r-numbers = "==0.9_2"
r-pheatmap = "==1.0.13"
r-plotly = "==4.12.0"
bioconductor-preprocesscore = "==1.68.0"
r-proc = "==1.19.0.1"
r-purrr = "==1.2.2"
r-randomforest = "==4.7_1.2"
r-rcpp = "==1.1.2"
r-readr = "==2.2.0"
r-readxl = "==1.5.0"
r-reshape2 = "==1.4.5"
r-rlang = "==1.3.0"
r-seurat = "==5.5.1"
bioconductor-singlecellexperiment = "==1.28.0"
bioconductor-slingshot = "==2.14.0"
r-stringr = "==1.6.0"
bioconductor-sva = "==3.54.0"
r-tidyr = "==1.3.2"
r-tidyverse = "==2.0.0"
bioconductor-viper = "==1.40.0"
r-wgcna = "==1.74"
# r-remotes: needed by the install-pcsf/install-omnipathr tasks above.
r-remotes = "==2.5.0"

# --- Jupyter (both a Python kernel and a dedicated R kernel; see
# CLAUDE_NOTES.md's "Running R in a Jupyter notebook" section) ---
jupyterlab = "==4.6.2"
ipykernel = "==7.3.0"
r-irkernel = "==1.3.2"
rpy2 = "==3.6.6"
